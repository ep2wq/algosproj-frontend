<!doctype html>
<html lang="en" class="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <!-- The AlgosLab mark (README "Icons"): favicon.svg, with a 32 px favicon.ico and a 180 px
         apple-touch-icon.png rendered from it. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The browser bar: --color-surface of the theme in use (src/index.css); dark by default, and
         src/theme.ts changes it with the theme. -->
    <meta name="theme-color" content="#0f172a" />
    <!-- The product name from src/site.ts, filled in by vite.config.ts. -->
    <title>%PRODUCT_NAME%</title>
    <script>
      // Sets the theme, lang and dir before the first paint, so a light page never flashes dark
      // and an Arabic page never flashes left-to-right. Same rules as src/theme.ts and src/i18n.ts:
      // a stored "light"/"dark" and "en"/"ar" win; otherwise dark (the static HTML is dark too) and
      // the browser language.
      try {
        var root = document.documentElement
        var theme = null
        var lang = null
        try {
          theme = localStorage.getItem('theme')
          lang = localStorage.getItem('lang')
        } catch (e) {}
        var dark = theme !== 'light'
        root.classList.toggle('dark', dark)
        root.style.colorScheme = dark ? 'dark' : 'light'
        if (!dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#ffffff')
        if (lang !== 'en' && lang !== 'ar') {
          var first = (navigator.languages && navigator.languages[0]) || navigator.language || ''
          lang = first.toLowerCase().indexOf('ar') === 0 ? 'ar' : 'en'
        }
        root.lang = lang
        root.dir = lang === 'ar' ? 'rtl' : 'ltr'
        // Arabic: the static HTML is English, so keep it from being laid out until the script
        // below has emptied it (no flash of the English page). No font preload: the web fonts load
        // after the app (src/fonts.css).
        if (lang !== 'en') {
          var hide = document.createElement('style')
          hide.id = 'hide-static'
          hide.textContent = '#root{display:none}'
          document.head.appendChild(hide)
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // A prerendered page's static HTML (scripts/prerender.mjs) is English and for one address.
      // The same index.html is served for every unknown address, and Arabic visitors get Arabic:
      // in those cases empty it now, so the wrong page or language never shows before the app.
      try {
        var page = document.getElementById('root')
        var path = location.pathname.replace(/\/+$/, '') || '/'
        if (page.getAttribute('data-prerendered') !== path || document.documentElement.lang !== 'en') page.textContent = ''
        var hidden = document.getElementById('hide-static')
        if (hidden) hidden.remove()
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
