server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        # about.html for /about (prerendered public pages), else the app.
        try_files $uri $uri.html $uri/ /index.html;
    }
}
